<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Campus Ideas Board{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f6f8;
            color: #242424;
        }

        .navbar {
            background: #182b49;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 600;
        }

        .main-container {
            max-width: 850px;
            margin: 35px auto;
        }

        .idea-card {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 16px;
        }

        .idea-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
        }

        .muted {
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">Campus Ideas Board</a>

        <a href="/ideas/new" class="btn btn-light btn-sm">
            + Share an idea
        </a>
    </div>
</nav>

<div class="container main-container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</div>

</body>
</html>
